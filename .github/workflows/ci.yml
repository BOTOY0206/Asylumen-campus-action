name: CI Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run inference test
        run: python examples/inference_real.py

      - name: Check output file
        run: |
          if exist data/sample_videos/demo_log.json (
            echo 文件生成成功
          ) else (
            echo 失败：未生成 demo_log.json
            exit 1
          )