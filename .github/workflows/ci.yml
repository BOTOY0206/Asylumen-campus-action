name: CI Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Miniconda (mamba)
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          use-mamba: true
          miniconda-version: latest
          python-version: "3.13"

      - name: Create conda env and install numpy (conda-forge)
        run: |
          mamba create -n ci-env python=3.13 -y
          conda run -n ci-env mamba install -y -c conda-forge "numpy=2.0.*"
          # Print basic numpy info (single-line python -c to keep it PowerShell-safe)
          conda run -n ci-env python -c "import sys, platform, numpy as np; print('PYTHON:', sys.version); print('PLATFORM:', platform.platform()); print('NUMPY:', np.__version__)"

      - name: Install remaining pip deps (inside conda env)
        run: |
          conda run -n ci-env python -m pip install --upgrade pip setuptools wheel
          # Install remaining requirements without reinstalling binary deps like numpy
          conda run -n ci-env python -m pip install --no-deps -r requirements.txt

      - name: Show package lists (debug)
        run: |
          conda run -n ci-env conda list
          conda run -n ci-env python -m pip freeze

      - name: Run inference test
        env:
          PYTHONUTF8: 1
        run: |
          conda run -n ci-env python examples/inference_real.py

      - name: Verify output file (inside conda env)
        run: |
          powershell -Command "if (Test-Path 'data/sample_videos/demo_log.json') { Write-Host 'CI Passed: File generated successfully'; exit 0 } else { Write-Host 'CI Failed: File not found'; exit 1 }"
