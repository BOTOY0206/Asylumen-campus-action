name: CI Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          miniconda-version: latest
          python-version: "3.13"

      - name: Create conda env and install numpy (conda-forge)
        run: |
          # create a fresh env with Python 3.13
          conda create -n ci-env python=3.13 -y
          # install numpy from conda-forge (Windows-compatible binary)
          conda install -n ci-env -y -c conda-forge "numpy=1.26.4"
          # ensure pip/setuptools/wheel are available inside the env
          conda run -n ci-env python -m pip install --upgrade pip setuptools wheel
          # show debug info
          conda run -n ci-env python -c "import sys, platform, numpy as np; print('PYTHON:', sys.version); print('PLATFORM:', platform.platform()); print('NUMPY:', np.__version__)"

      - name: Install OpenCV (pip inside env)
        run: |
          # install opencv headless inside the created conda env
          conda run -n ci-env python -m pip install --no-deps opencv-python-headless==4.10.0.84

      - name: Show package lists (debug)
        run: |
          conda run -n ci-env conda list
          conda run -n ci-env python -m pip freeze

      - name: Run inference test
        env:
          PYTHONUTF8: 1
        run: |
          # Run your inference script (it will create demo_log.json when no video present)
          conda run -n ci-env python examples/inference_real.py

      - name: Verify CI output file (inside conda env)
        run: |
          powershell -Command "if (Test-Path 'data/sample_videos/demo_log.json') { Write-Host 'CI Passed: File generated successfully'; exit 0 } else { Write-Host 'CI Failed: File not found'; exit 1 }"
