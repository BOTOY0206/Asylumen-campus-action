name: CI Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run inference test
        run: python examples/inference_real.py

      - name: Verify demo_log.json
        run: |
          if exist data\sample_videos\demo_log.json (
            echo ✅ demo_log.json generated successfully
          ) else (
            echo ❌ Error: demo_log.json not found
            exit 1
          )
