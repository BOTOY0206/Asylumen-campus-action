name: CI Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run inference test
        env:
          PYTHONUTF8: 1
        run: python examples/inference_real.py

      - name: Verify output file
        run: |
          if (Test-Path "data/sample_videos/demo_log.json") {
            Write-Host " CI Passed: File generated successfully"
          } else {
            Write-Host " CI Failed: File not found"
            exit 1
          }
        shell: powershell
