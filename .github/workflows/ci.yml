name: CI Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          miniconda-version: latest
          python-version: "3.13"

      - name: Create conda env (python 3.13)
        run: |
          conda create -n ci-env -y python=3.13
          conda run -n ci-env python -m pip install --upgrade pip setuptools wheel

      - name: Install numpy via pip inside conda env
        run: |
          conda run -n ci-env python -m pip install --no-deps numpy==2.4.4

      - name: Prepare and install remaining pip deps (exclude heavy binary packages)
        run: |
          conda run -n ci-env python -c "from pathlib import Path; import re; p=Path('requirements.txt'); lines=p.read_text(encoding='utf-8').splitlines() if p.exists() else []; out=[l for l in lines if not re.match(r'^\s*(?:numpy|ultralytics|torch|torchvision)\b', l)]; Path('tmp_reqs_ci.txt').write_text('\\n'.join(out), encoding='utf-8')"
          conda run -n ci-env python -m pip install --no-deps -r tmp_reqs_ci.txt
          powershell -Command "Remove-Item tmp_reqs_ci.txt -ErrorAction SilentlyContinue"

      - name: Install OpenCV explicitly (pip inside env)
        run: |
          conda run -n ci-env python -m pip install --no-deps opencv-python-headless==4.10.0.84

      - name: Debug - verify python/numpy info
        run: |
          powershell -Command "try { conda run -n ci-env python -c 'import numpy as np; print(\"NUMPY_INSTALLED: True\"); print(\"NUMPY_VERSION:\", np.__version__)' } catch { Write-Host 'NUMPY_INSTALLED: False' $_ } ; conda run -n ci-env python -c 'import sys; print(\"PYTHON:\", sys.version); print(\"EXEC:\", sys.executable)'"

      - name: Show package lists (debug)
        run: |
          conda run -n ci-env conda list
          conda run -n ci-env python -m pip freeze

      - name: Run inference test
        env:
          PYTHONUTF8: 1
        run: |
          conda run -n ci-env python examples/inference_real.py

      - name: Verify CI output file (inside conda env)
        run: |
          powershell -Command "if (Test-Path 'data/sample_videos/demo_log.json') { Write-Host 'CI Passed: File generated successfully'; exit 0 } else { Write-Host 'CI Failed: File not found'; exit 1 }"
