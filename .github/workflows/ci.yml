name: CI Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          miniconda-version: latest
          python-version: "3.13"

      - name: Create conda env (python 3.13)
        run: |
          # create env (no numpy here - we'll pip install numpy)
          conda create -n ci-env -y python=3.13
          # make sure pip/setuptools/wheel available
          conda run -n ci-env python -m pip install --upgrade pip setuptools wheel

      - name: Install numpy via pip inside conda env
        run: |
          # Use the same numpy version you installed locally (adjust if needed)
          conda run -n ci-env python -m pip install --no-deps numpy==2.4.4

      - name: Prepare and install remaining pip deps (exclude heavy binary packages)
        run: |
          # Build a temporary requirements that excludes numpy/ultralytics/torch to avoid pip binary conflicts
          powershell -Command "if (Test-Path 'requirements.txt') { Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*(numpy|ultralytics|torch|torchvision)\b' } | Set-Content tmp_reqs_ci.txt } else { '' > tmp_reqs_ci.txt }"
          conda run -n ci-env python -m pip install --no-deps -r tmp_reqs_ci.txt
          powershell -Command "Remove-Item tmp_reqs_ci.txt -ErrorAction SilentlyContinue"

      - name: Install OpenCV explicitly (pip inside env)
        run: |
          conda run -n ci-env python -m pip install --no-deps opencv-python-headless==4.10.0.84

      - name: Debug: verify python/numpy info
        run: |
          conda run -n ci-env python - <<PY
import sys, platform
try:
    import numpy as np
    print("NUMPY:", np.__version__)
except Exception as e:
    print("NUMPY import failed:", e)
print("PYTHON:", sys.version)
print("EXEC:", sys.executable)
PY

      - name: Show package lists (debug)
        run: |
          conda run -n ci-env conda list
          conda run -n ci-env python -m pip freeze

      - name: Run inference test
        env:
          PYTHONUTF8: 1
        run: |
          conda run -n ci-env python examples/inference_real.py

      - name: Verify CI output file (inside conda env)
        run: |
          powershell -Command "if (Test-Path 'data/sample_videos/demo](#)

